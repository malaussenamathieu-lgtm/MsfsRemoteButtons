<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MSFS Remote Buttons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>✈️ MSFS Remote Buttons</h1>
        <div class="status">
            <div class="status-item">
                <span class="status-dot" id="wsStatus"></span>
                <span>Serveur</span>
            </div>
            <div class="status-item">
                <span class="status-dot" id="simStatus"></span>
                <span>MSFS</span>
            </div>
        </div>
        <div class="status" style="margin-top: 8px;">
            <span class="aircraft-name" id="aircraftName">En attente...</span>
        </div>
    </div>

    <div id="controls">
        <div class="loading">Connexion au serveur...</div>
    </div>

    <div class="disconnected-overlay" id="disconnectedOverlay">
        <h2>⚠️ Déconnecté</h2>
        <p>Connexion au serveur perdue. Reconnexion...</p>
    </div>

    <script>
        // ================================================================
        // MSFS REMOTE BUTTONS - CLIENT WEB
        // ================================================================
        //
        // Architecture:
        // - WebSocket pour la communication temps réel avec le serveur
        // - Génération dynamique de l'interface selon le profil d'avion
        // - Mise à jour visuelle instantanée des états (LEDs, sélecteurs)
        //
        // Flux de données:
        // 1. Connexion WebSocket → Réception du profil → Génération de l'UI
        // 2. Clic bouton → Envoi commande → Serveur → MSFS
        // 3. MSFS change état → Serveur → WebSocket → Mise à jour UI
        //
        // ================================================================

        // === ÉTAT GLOBAL ===
        let ws = null;               // Instance WebSocket
        let profile = null;          // Profil d'avion actuel (commandes, catégories)
        let states = {};             // Cache des états: { commandId: valeur }
        let reconnectTimeout = null; // Timer pour reconnexion auto

        // === ÉLÉMENTS DOM ===
        const controlsEl = document.getElementById('controls');
        const wsStatusEl = document.getElementById('wsStatus');
        const simStatusEl = document.getElementById('simStatus');
        const aircraftNameEl = document.getElementById('aircraftName');
        const disconnectedOverlay = document.getElementById('disconnectedOverlay');

        // ================================================================
        // CONNEXION WEBSOCKET
        // ================================================================

        /**
         * Établit la connexion WebSocket avec le serveur
         * Gère automatiquement la reconnexion en cas de perte de connexion
         */
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;

            console.log('Connexion à', wsUrl);
            ws = new WebSocket(wsUrl);

            // Connexion établie
            ws.onopen = () => {
                console.log('WebSocket connecté');
                wsStatusEl.classList.add('connected');
                disconnectedOverlay.classList.remove('show');
                // Demander l'état initial au serveur
                ws.send(JSON.stringify({ type: 'getState' }));
            };

            // Connexion perdue - Reconnexion automatique après 2 secondes
            ws.onclose = () => {
                console.log('WebSocket déconnecté');
                wsStatusEl.classList.remove('connected');
                simStatusEl.classList.remove('connected');
                disconnectedOverlay.classList.add('show');

                if (reconnectTimeout) clearTimeout(reconnectTimeout);
                reconnectTimeout = setTimeout(connect, 2000);
            };

            ws.onerror = (err) => {
                console.error('Erreur WebSocket:', err);
            };

            // Réception d'un message du serveur
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleMessage(msg);
                } catch (e) {
                    console.error('Erreur parsing message:', e);
                }
            };
        }

        // ================================================================
        // TRAITEMENT DES MESSAGES SERVEUR
        // ================================================================

        /**
         * Route les messages reçus du serveur vers les handlers appropriés
         * Types: connection, aircraft, state, pong
         */
        function handleMessage(msg) {
            switch (msg.type) {
                case 'connection':
                    if (msg.data.connected) {
                        simStatusEl.classList.add('connected');
                    } else {
                        simStatusEl.classList.remove('connected');
                        aircraftNameEl.textContent = 'MSFS non connecté';
                    }
                    break;

                case 'aircraft':
                    aircraftNameEl.textContent = msg.data.title || 'Inconnu';
                    if (msg.data.profile) {
                        profile = msg.data.profile;
                        renderControls();
                    }
                    break;

                case 'state':
                    states[msg.data.id] = msg.data.value;
                    updateControlState(msg.data.id, msg.data.value);
                    break;

                case 'pong':
                    // Heartbeat OK - Connexion toujours active
                    break;
            }
        }

        // ================================================================
        // GÉNÉRATION DE L'INTERFACE
        // ================================================================

        /**
         * Génère l'interface complète selon le profil d'avion
         * Appelé quand un nouveau profil est reçu (changement d'avion)
         */
        function renderControls() {
            if (!profile) {
                controlsEl.innerHTML = '<div class="loading">En attente du profil...</div>';
                return;
            }

            let html = '';

            for (const category of profile.categories) {
                const commands = profile.commands.filter(c => c.category === category && !c.hidden);
                if (commands.length === 0) continue;

                html += `<div class="category">`;
                html += `<div class="category-title">${category}</div>`;

                // Special layout for AUTOPILOT with displays
                if (category === 'AUTOPILOT') {
                    html += `<div class="autopilot-panel">`;
                    // Displays row - ABOVE buttons (displays only)
                    html += `<div class="displays-row">`;
                    html += `<div class="display-spacer"></div>`; // AP
                    html += `<div class="display-spacer"></div>`; // FD
                    html += `<div class="display-box"><div class="display-label">SPD</div><div class="display-value" id="display-spd">---</div></div>`;
                    html += `<div class="display-box"><div class="display-label">HDG</div><div class="display-value" id="display-hdg">---</div></div>`;
                    html += `<div class="display-box"><div class="display-label">ALT</div><div class="display-value" id="display-alt">-----</div></div>`;
                    html += `<div class="display-spacer"></div>`; // NAV
                    html += `<div class="display-spacer"></div>`; // APR
                    html += `<div class="display-box"><div class="display-label">VS</div><div class="display-value" id="display-vs">----</div></div>`;
                    html += `</div>`; // close displays-row
                }

                html += `<div class="category-buttons">`;

                for (const cmd of commands) {
                    if (cmd.controlType === 'toggle') {
                        html += renderToggle(cmd);
                    } else if (cmd.controlType === 'selector') {
                        html += renderSelector(cmd);
                    } else if (cmd.controlType === 'momentary') {
                        html += renderMomentary(cmd);
                    }
                }

                html += `</div>`; // close category-buttons

                // Control buttons row - BELOW main buttons
                if (category === 'AUTOPILOT') {
                    html += `<div class="controls-row">`;
                    html += `<div class="control-spacer"></div>`; // AP
                    html += `<div class="control-spacer"></div>`; // FD
                    // SPD controls
                    html += `<div class="control-group"><button class="ctrl-btn" onclick="sendToggle('spd_dec')">−</button><button class="ctrl-btn" onclick="sendToggle('spd_inc')">+</button></div>`;
                    // HDG controls (2x2 grid)
                    html += `<div class="control-group grid-2x2"><button class="ctrl-btn" onclick="sendToggle('hdg_dec_10')">−10</button><button class="ctrl-btn" onclick="sendToggle('hdg_inc_10')">+10</button><button class="ctrl-btn" onclick="sendToggle('hdg_dec_1')">−1</button><button class="ctrl-btn" onclick="sendToggle('hdg_inc_1')">+1</button></div>`;
                    // ALT controls (2x2 grid)
                    html += `<div class="control-group grid-2x2"><button class="ctrl-btn" onclick="sendToggle('alt_dec_1000')">−1000</button><button class="ctrl-btn" onclick="sendToggle('alt_inc_1000')">+1000</button><button class="ctrl-btn" onclick="sendToggle('alt_dec_100')">−100</button><button class="ctrl-btn" onclick="sendToggle('alt_inc_100')">+100</button></div>`;
                    html += `<div class="control-spacer"></div>`; // NAV
                    html += `<div class="control-spacer"></div>`; // APR
                    // VS controls
                    html += `<div class="control-group"><button class="ctrl-btn" onclick="sendToggle('vs_dec')">DN</button><button class="ctrl-btn" onclick="sendToggle('vs_inc')">UP</button></div>`;
                    html += `</div>`; // close controls-row
                    html += `</div>`; // close autopilot-panel
                }
                html += `</div>`; // close category
            }

            controlsEl.innerHTML = html;

            // Appliquer les états déjà connus aux nouveaux éléments
            for (const [id, value] of Object.entries(states)) {
                updateControlState(id, value);
            }
        }

        /**
         * Génère le HTML pour un bouton Toggle (ON/OFF avec LED)
         */
        function renderToggle(cmd) {
            const state = states[cmd.id] || 0;
            const stateClass = state > 0.5 ? 'on' : 'off';
            return `
                <button class="btn-toggle ${stateClass}" data-id="${cmd.id}" onclick="sendToggle('${cmd.id}')">
                    <div class="indicator"></div>
                    <span class="label">${cmd.name}</span>
                </button>
            `;
        }

        /**
         * Génère le HTML pour un Selector (multi-positions)
         * Cas spécial pour les volets (flaps) avec boutons +/-
         */
        function renderSelector(cmd) {
            if (!cmd.options) return '';

            const currentValue = states[cmd.id] || 0;

            let optionsHtml = '';
            for (const opt of cmd.options) {
                const active = Math.abs(currentValue - opt.value) < 0.5 ? 'active' : '';
                optionsHtml += `
                    <button class="selector-option ${active}"
                            data-id="${cmd.id}"
                            data-value="${opt.value}"
                            onclick="sendSelector('${cmd.id}', '${opt.simEvent}', ${opt.value})">
                        ${opt.label}
                    </button>
                `;
            }

            // Special layout for flaps: vertical selector with +/- buttons on right
            if (cmd.id === 'flaps') {
                return `
                    <div class="flaps-control" data-id="${cmd.id}">
                        <span class="selector-label">${cmd.name}</span>
                        <div class="flaps-content">
                            <div class="selector-options">
                                ${optionsHtml}
                            </div>
                            <div class="flaps-buttons">
                                <button class="flaps-btn" onclick="sendToggle('flaps_decr')">−</button>
                                <button class="flaps-btn" onclick="sendToggle('flaps_incr')">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="selector" data-id="${cmd.id}">
                    <span class="selector-label">${cmd.name}</span>
                    <div class="selector-options">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        /**
         * Génère le HTML pour un bouton Momentary (appui bref, pas de LED)
         */
        function renderMomentary(cmd) {
            return `
                <button class="btn-momentary" data-id="${cmd.id}" onclick="sendToggle('${cmd.id}')">
                    <span class="label">${cmd.name}</span>
                </button>
            `;
        }

        // ================================================================
        // MISE À JOUR DE L'INTERFACE
        // ================================================================

        /**
         * Met à jour l'état visuel d'un contrôle
         * Appelé quand le serveur envoie un changement d'état
         *
         * @param {string} id - ID de la commande (ex: "nav_lights")
         * @param {number} value - Nouvelle valeur (0.0 ou 1.0 pour Bool, autres pour Number)
         */
        function updateControlState(id, value) {
            states[id] = value;

            // Toggle buttons
            const toggleBtn = document.querySelector(`.btn-toggle[data-id="${id}"]`);
            if (toggleBtn) {
                toggleBtn.classList.remove('on', 'off');
                toggleBtn.classList.add(value > 0.5 ? 'on' : 'off');
            }

            // Selector options (including flaps-control)
            const selector = document.querySelector(`.selector[data-id="${id}"], .flaps-control[data-id="${id}"]`);
            if (selector) {
                const options = selector.querySelectorAll('.selector-option');
                options.forEach(opt => {
                    const optValue = parseFloat(opt.dataset.value);
                    opt.classList.toggle('active', Math.abs(value - optValue) < 0.5);
                });
            }

            // === AFFICHEURS AUTOPILOT ===
            // Ces IDs correspondent aux commandes "hidden" du profil
            // Logique spéciale: SPD et VS ne s'affichent que si le mode correspondant est actif
            if (id === 'display_spd') {
                const el = document.getElementById('display-spd');
                const flcActive = states['ap_flc'] > 0.5;
                if (el) el.textContent = flcActive ? Math.round(value) : '---';
            }
            if (id === 'display_hdg') {
                const el = document.getElementById('display-hdg');
                if (el) el.textContent = Math.round(value).toString().padStart(3, '0');
            }
            if (id === 'display_alt') {
                const el = document.getElementById('display-alt');
                if (el) el.textContent = Math.round(value).toString().padStart(5, '0');
            }
            if (id === 'display_vs') {
                const el = document.getElementById('display-vs');
                const vsActive = states['ap_vs'] > 0.5;
                if (el) el.textContent = vsActive ? ((value >= 0 ? '+' : '') + Math.round(value)) : '----';
            }
            // Update displays when button state changes
            if (id === 'ap_flc') {
                const el = document.getElementById('display-spd');
                const spdValue = states['display_spd'] || 0;
                if (el) el.textContent = value > 0.5 ? Math.round(spdValue) : '---';
            }
            if (id === 'ap_vs') {
                const el = document.getElementById('display-vs');
                const vsValue = states['display_vs'] || 0;
                if (el) el.textContent = value > 0.5 ? ((vsValue >= 0 ? '+' : '') + Math.round(vsValue)) : '----';
            }
        }

        // ================================================================
        // ENVOI DE COMMANDES
        // ================================================================

        /**
         * Envoie une commande Toggle/Momentary au serveur
         * @param {string} id - ID de la commande (ex: "nav_lights", "hdg_inc_10")
         */
        function sendToggle(id) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({
                type: 'command',
                data: { id: id }
            }));
        }

        /**
         * Envoie une commande Selector au serveur avec l'event spécifique
         * @param {string} id - ID de la commande (ex: "flaps")
         * @param {string} simEvent - Event SimConnect à exécuter (ex: "FLAPS_2")
         * @param {number} value - Valeur de la position (ex: 2)
         */
        function sendSelector(id, simEvent, value) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({
                type: 'command',
                data: { id: id, simEvent: simEvent, value: value }
            }));

            // Mise à jour optimiste de l'UI (n'attend pas la confirmation serveur)
            updateControlState(id, value);
        }

        // ================================================================
        // HEARTBEAT & DÉMARRAGE
        // ================================================================

        // Ping toutes les 30 secondes pour garder la connexion active
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);

        // Démarrage de l'application
        connect();
    </script>
</body>
</html>
