 <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSFS Remote Buttons</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Consolas', 'Courier New', monospace;
            background: #1a1a1a;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 { font-size: 1.2em; color: #00ff00; margin-bottom: 1rem; }
        .status { margin-bottom: 1.5rem; color: #888; font-size: 0.9em; }
        .status.connected { color: #00ff00; }
        .aircraft-links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 1rem; }
        .aircraft-links a {
            display: inline-block;
            padding: 12px 24px;
            background: #333;
            border: 1px solid #555;
            color: #00ff00;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.95em;
        }
        .aircraft-links a:hover { background: #444; border-color: #00ff00; }
    </style>
</head>
<body>
    <h1>✈️ MSFS Remote Buttons</h1>
    <div class="status" id="status">Connexion au serveur...</div>
    <p id="message">Détection de l'avion en cours. Redirection automatique.</p>
    <div class="aircraft-links" id="aircraftLinks">
        <a href="/C172/">Cessna 172 G1000</a>
        <a href="/PC12/">Pilatus PC-12 NGX</a>
    </div>

    <script>
        (function() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = protocol + '//' + window.location.host + '/ws';
            const statusEl = document.getElementById('status');
            const messageEl = document.getElementById('message');

            const ws = new WebSocket(wsUrl);
            ws.onopen = function() {
                statusEl.textContent = 'Connecté. Attente de MSFS...';
                statusEl.classList.add('connected');
                ws.send(JSON.stringify({ type: 'getState' }));
            };
            ws.onclose = function() {
                statusEl.textContent = 'Déconnecté. Réessayez ou choisissez un avion ci-dessous.';
                statusEl.classList.remove('connected');
            };
            ws.onmessage = function(event) {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'aircraft' && msg.data && msg.data.profile && msg.data.profile.id) {
                        const aircraftId = msg.data.profile.id;
                        messageEl.textContent = 'Avion détecté: ' + (msg.data.title || aircraftId) + '. Redirection...';
                        window.location.replace('/' + aircraftId + '/');
                    } else if (msg.type === 'connection' && msg.data && msg.data.connected) {
                        statusEl.textContent = 'Connecté à MSFS. Attente du profil avion...';
                    }
                } catch (e) {}
            };
        })();
    </script>
</body>
</html>
