<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MSFS Remote Buttons</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 10px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #16213e, #1a1a2e);
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 1.3em;
            color: #4fc3f7;
            margin-bottom: 5px;
        }

        .status {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.85em;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f44336;
        }

        .status-dot.connected {
            background: #4caf50;
            box-shadow: 0 0 10px #4caf50;
        }

        .aircraft-name {
            color: #ffd54f;
            font-weight: bold;
        }

        /* Categories */
        .category {
            margin-bottom: 15px;
        }

        .category-title {
            font-size: 0.8em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 12px;
            background: #16213e;
            border-radius: 8px 8px 0 0;
            border-bottom: 2px solid #4fc3f7;
        }

        .category-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            padding: 10px;
            background: rgba(22, 33, 62, 0.5);
            border-radius: 0 0 8px 8px;
        }

        /* Toggle Button */
        .btn-toggle {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            background: linear-gradient(180deg, #3a3a4a, #2a2a3a);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            min-height: 70px;
        }

        .btn-toggle:active {
            transform: scale(0.95);
            box-shadow: 0 2px 3px rgba(0,0,0,0.3);
        }

        .btn-toggle .indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-bottom: 6px;
            background: #555;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        .btn-toggle.on .indicator {
            background: #4caf50;
            box-shadow: 0 0 15px #4caf50, inset 0 -2px 4px rgba(0,0,0,0.3);
        }

        .btn-toggle.off .indicator {
            background: #f44336;
            box-shadow: 0 0 10px rgba(244, 67, 54, 0.5), inset 0 -2px 4px rgba(0,0,0,0.3);
        }

        .btn-toggle .label {
            font-size: 0.75em;
            color: #ccc;
            text-align: center;
            font-weight: 500;
        }

        /* Selector */
        .selector {
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #3a3a4a, #2a2a3a);
            border-radius: 8px;
            padding: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            grid-column: span 2;
        }

        .selector-label {
            font-size: 0.7em;
            color: #888;
            text-align: center;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .selector-options {
            display: flex;
            gap: 4px;
        }

        .selector-option {
            flex: 1;
            padding: 10px 4px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7em;
            font-weight: bold;
            background: #444;
            color: #aaa;
            transition: all 0.15s ease;
        }

        .selector-option:active {
            transform: scale(0.95);
        }

        .selector-option.active {
            background: linear-gradient(180deg, #4fc3f7, #0288d1);
            color: #fff;
            box-shadow: 0 0 10px rgba(79, 195, 247, 0.5);
        }

        /* Momentary Button */
        .btn-momentary {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s ease;
            background: linear-gradient(180deg, #5a5a6a, #4a4a5a);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
            min-height: 70px;
            color: #ccc;
        }

        .btn-momentary:active {
            transform: scale(0.9);
            background: linear-gradient(180deg, #4fc3f7, #0288d1);
            color: #fff;
        }

        .btn-momentary .label {
            font-size: 0.75em;
            font-weight: 500;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #4fc3f7;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Disconnected overlay */
        .disconnected-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        .disconnected-overlay.show {
            display: flex;
        }

        .disconnected-overlay h2 {
            color: #f44336;
            margin-bottom: 10px;
        }

        .disconnected-overlay p {
            color: #888;
        }

        /* Responsive */
        @media (min-width: 600px) {
            body {
                padding: 20px;
                max-width: 800px;
                margin: 0 auto;
            }

            .category-buttons {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }

            .btn-toggle, .btn-momentary {
                min-height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✈️ MSFS Remote Buttons</h1>
        <div class="status">
            <div class="status-item">
                <span class="status-dot" id="wsStatus"></span>
                <span>Serveur</span>
            </div>
            <div class="status-item">
                <span class="status-dot" id="simStatus"></span>
                <span>MSFS</span>
            </div>
        </div>
        <div class="status" style="margin-top: 8px;">
            <span class="aircraft-name" id="aircraftName">En attente...</span>
        </div>
    </div>

    <div id="controls">
        <div class="loading">Connexion au serveur...</div>
    </div>

    <div class="disconnected-overlay" id="disconnectedOverlay">
        <h2>⚠️ Déconnecté</h2>
        <p>Connexion au serveur perdue. Reconnexion...</p>
    </div>

    <script>
        // État global
        let ws = null;
        let profile = null;
        let states = {};
        let reconnectTimeout = null;

        // Éléments DOM
        const controlsEl = document.getElementById('controls');
        const wsStatusEl = document.getElementById('wsStatus');
        const simStatusEl = document.getElementById('simStatus');
        const aircraftNameEl = document.getElementById('aircraftName');
        const disconnectedOverlay = document.getElementById('disconnectedOverlay');

        // Connexion WebSocket
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            console.log('Connexion à', wsUrl);
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connecté');
                wsStatusEl.classList.add('connected');
                disconnectedOverlay.classList.remove('show');
                ws.send(JSON.stringify({ type: 'getState' }));
            };

            ws.onclose = () => {
                console.log('WebSocket déconnecté');
                wsStatusEl.classList.remove('connected');
                simStatusEl.classList.remove('connected');
                disconnectedOverlay.classList.add('show');
                
                // Reconnexion automatique
                if (reconnectTimeout) clearTimeout(reconnectTimeout);
                reconnectTimeout = setTimeout(connect, 2000);
            };

            ws.onerror = (err) => {
                console.error('Erreur WebSocket:', err);
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleMessage(msg);
                } catch (e) {
                    console.error('Erreur parsing message:', e);
                }
            };
        }

        // Traitement des messages
        function handleMessage(msg) {
            switch (msg.type) {
                case 'connection':
                    if (msg.data.connected) {
                        simStatusEl.classList.add('connected');
                    } else {
                        simStatusEl.classList.remove('connected');
                        aircraftNameEl.textContent = 'MSFS non connecté';
                    }
                    break;

                case 'aircraft':
                    aircraftNameEl.textContent = msg.data.title || 'Inconnu';
                    if (msg.data.profile) {
                        profile = msg.data.profile;
                        renderControls();
                    }
                    break;

                case 'state':
                    states[msg.data.id] = msg.data.value;
                    updateControlState(msg.data.id, msg.data.value);
                    break;

                case 'pong':
                    // Heartbeat OK
                    break;
            }
        }

        // Rendu des contrôles
        function renderControls() {
            if (!profile) {
                controlsEl.innerHTML = '<div class="loading">En attente du profil...</div>';
                return;
            }

            let html = '';

            for (const category of profile.categories) {
                const commands = profile.commands.filter(c => c.category === category && !c.hidden);
                if (commands.length === 0) continue;

                html += `<div class="category">`;
                html += `<div class="category-title">${category}</div>`;
                html += `<div class="category-buttons">`;

                for (const cmd of commands) {
                    if (cmd.controlType === 'toggle') {
                        html += renderToggle(cmd);
                    } else if (cmd.controlType === 'selector') {
                        html += renderSelector(cmd);
                    } else if (cmd.controlType === 'momentary') {
                        html += renderMomentary(cmd);
                    }
                }

                html += `</div></div>`;
            }

            controlsEl.innerHTML = html;

            // Mettre à jour les états
            for (const [id, value] of Object.entries(states)) {
                updateControlState(id, value);
            }
        }

        function renderToggle(cmd) {
            const state = states[cmd.id] || 0;
            const stateClass = state > 0.5 ? 'on' : 'off';
            return `
                <button class="btn-toggle ${stateClass}" data-id="${cmd.id}" onclick="sendToggle('${cmd.id}')">
                    <div class="indicator"></div>
                    <span class="label">${cmd.name}</span>
                </button>
            `;
        }

        function renderSelector(cmd) {
            if (!cmd.options) return '';
            
            const currentValue = states[cmd.id] || 0;
            
            let optionsHtml = '';
            for (const opt of cmd.options) {
                const active = Math.abs(currentValue - opt.value) < 0.5 ? 'active' : '';
                optionsHtml += `
                    <button class="selector-option ${active}" 
                            data-id="${cmd.id}" 
                            data-value="${opt.value}"
                            onclick="sendSelector('${cmd.id}', '${opt.simEvent}', ${opt.value})">
                        ${opt.label}
                    </button>
                `;
            }

            return `
                <div class="selector" data-id="${cmd.id}">
                    <span class="selector-label">${cmd.name}</span>
                    <div class="selector-options">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        function renderMomentary(cmd) {
            return `
                <button class="btn-momentary" onclick="sendToggle('${cmd.id}')">
                    <span class="label">${cmd.name}</span>
                </button>
            `;
        }

        // Mise à jour de l'état visuel
        function updateControlState(id, value) {
            states[id] = value;

            // Toggle buttons
            const toggleBtn = document.querySelector(`.btn-toggle[data-id="${id}"]`);
            if (toggleBtn) {
                toggleBtn.classList.remove('on', 'off');
                toggleBtn.classList.add(value > 0.5 ? 'on' : 'off');
            }

            // Selector options
            const selector = document.querySelector(`.selector[data-id="${id}"]`);
            if (selector) {
                const options = selector.querySelectorAll('.selector-option');
                options.forEach(opt => {
                    const optValue = parseFloat(opt.dataset.value);
                    opt.classList.toggle('active', Math.abs(value - optValue) < 0.5);
                });
            }
        }

        // Envoi des commandes
        function sendToggle(id) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            ws.send(JSON.stringify({
                type: 'command',
                data: { id: id }
            }));
        }

        function sendSelector(id, simEvent, value) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            ws.send(JSON.stringify({
                type: 'command',
                data: { id: id, simEvent: simEvent }
            }));

            // Mise à jour optimiste
            updateControlState(id, value);
        }

        // Heartbeat
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);

        // Démarrage
        connect();
    </script>
</body>
</html>
