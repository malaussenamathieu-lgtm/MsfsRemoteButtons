<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MSFS Remote Buttons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>✈️ MSFS Remote Buttons</h1>
        <div class="status">
            <div class="status-item">
                <span class="status-dot" id="wsStatus"></span>
                <span>Serveur</span>
            </div>
            <div class="status-item">
                <span class="status-dot" id="simStatus"></span>
                <span>MSFS</span>
            </div>
        </div>
        <div class="status" style="margin-top: 8px;">
            <span class="aircraft-name" id="aircraftName">En attente...</span>
        </div>
    </div>

    <div id="controls">
        <div class="loading">Connexion au serveur...</div>
    </div>

    <div class="disconnected-overlay" id="disconnectedOverlay">
        <h2>⚠️ Déconnecté</h2>
        <p>Connexion au serveur perdue. Reconnexion...</p>
    </div>

    <script>
        // ================================================================
        // MSFS REMOTE BUTTONS - CLIENT WEB
        // ================================================================
        //
        // Architecture:
        // - WebSocket pour la communication temps réel avec le serveur
        // - Génération dynamique de l'interface selon le profil d'avion
        // - Mise à jour visuelle instantanée des états (LEDs, sélecteurs)
        //
        // Flux de données:
        // 1. Connexion WebSocket → Réception du profil → Génération de l'UI
        // 2. Clic bouton → Envoi commande → Serveur → MSFS
        // 3. MSFS change état → Serveur → WebSocket → Mise à jour UI
        //
        // ================================================================

        // === ÉTAT GLOBAL ===
        let ws = null;               // Instance WebSocket
        let profile = null;          // Profil d'avion actuel (commandes, catégories)
        let states = {};             // Cache des états: { commandId: valeur }
        let reconnectTimeout = null; // Timer pour reconnexion auto

        // === ÉLÉMENTS DOM ===
        const controlsEl = document.getElementById('controls');
        const wsStatusEl = document.getElementById('wsStatus');
        const simStatusEl = document.getElementById('simStatus');
        const aircraftNameEl = document.getElementById('aircraftName');
        const disconnectedOverlay = document.getElementById('disconnectedOverlay');

        // ================================================================
        // CONNEXION WEBSOCKET
        // ================================================================

        /**
         * Établit la connexion WebSocket avec le serveur
         * Gère automatiquement la reconnexion en cas de perte de connexion
         */
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;

            console.log('Connexion à', wsUrl);
            ws = new WebSocket(wsUrl);

            // Connexion établie
            ws.onopen = () => {
                console.log('WebSocket connecté');
                wsStatusEl.classList.add('connected');
                disconnectedOverlay.classList.remove('show');
                // Demander l'état initial au serveur
                ws.send(JSON.stringify({ type: 'getState' }));
            };

            // Connexion perdue - Reconnexion automatique après 2 secondes
            ws.onclose = () => {
                console.log('WebSocket déconnecté');
                wsStatusEl.classList.remove('connected');
                simStatusEl.classList.remove('connected');
                disconnectedOverlay.classList.add('show');

                if (reconnectTimeout) clearTimeout(reconnectTimeout);
                reconnectTimeout = setTimeout(connect, 2000);
            };

            ws.onerror = (err) => {
                console.error('Erreur WebSocket:', err);
            };

            // Réception d'un message du serveur
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleMessage(msg);
                } catch (e) {
                    console.error('Erreur parsing message:', e);
                }
            };
        }

        // ================================================================
        // TRAITEMENT DES MESSAGES SERVEUR
        // ================================================================

        /**
         * Route les messages reçus du serveur vers les handlers appropriés
         * Types: connection, aircraft, state, pong
         */
        function handleMessage(msg) {
            switch (msg.type) {
                case 'connection':
                    if (msg.data.connected) {
                        simStatusEl.classList.add('connected');
                    } else {
                        simStatusEl.classList.remove('connected');
                        aircraftNameEl.textContent = 'MSFS non connecté';
                    }
                    break;

                case 'aircraft':
                    aircraftNameEl.textContent = msg.data.title || 'Inconnu';
                    if (msg.data.profile) {
                        profile = msg.data.profile;
                        renderControls();
                    }
                    break;

                case 'state':
                    states[msg.data.id] = msg.data.value;
                    updateControlState(msg.data.id, msg.data.value);
                    break;

                case 'pong':
                    // Heartbeat OK - Connexion toujours active
                    break;
            }
        }

        // ================================================================
        // GÉNÉRATION DE L'INTERFACE
        // ================================================================

        /**
         * Génère l'interface complète selon le profil d'avion
         * Appelé quand un nouveau profil est reçu (changement d'avion)
         */
        function renderControls() {
            if (!profile) {
                controlsEl.innerHTML = '<div class="loading">En attente du profil...</div>';
                return;
            }

            let html = '';

            for (const category of profile.categories) {
                const commands = profile.commands.filter(c => c.category === category && !c.hidden);
                if (commands.length === 0) continue;

                html += `<div class="category" data-category="${category}">`;
                html += `<div class="category-title">${category}</div>`;

                // Special layout for AUTOPILOT with displays
                if (category === 'AUTOPILOT') {
                    html += `<div class="autopilot-panel">`;
                    // Displays row - ABOVE buttons (displays only)
                    html += `<div class="displays-row">`;
                    html += `<div class="display-spacer"></div>`; // AP
                    html += `<div class="display-spacer"></div>`; // FD
                    html += `<div class="display-box"><div class="display-label">HDG</div><div class="display-value" id="display-hdg">---</div></div>`;
                    html += `<div class="display-box"><div class="display-label">ALT</div><div class="display-value" id="display-alt">-----</div></div>`;
                    html += `<div class="display-spacer"></div>`; // NAV
                    html += `<div class="display-spacer"></div>`; // VNAV
                    html += `<div class="display-spacer"></div>`; // APR
                    html += `<div class="display-spacer"></div>`; // BC (pas encore créé)
                    html += `<div class="display-box"><div class="display-label">VS</div><div class="display-value" id="display-vs">----</div></div>`;
                    html += `<div class="display-box"><div class="display-label">SPD</div><div class="display-value" id="display-spd">---</div></div>`; // FLC
                    html += `</div>`; // close displays-row
                    
                    // Mode buttons row - INSIDE autopilot-panel
                    html += `<div class="category-buttons">`;
                    for (const cmd of commands) {
                        if (cmd.controlType === 'toggle') {
                            html += renderToggle(cmd);
                        }
                    }
                    html += `</div>`; // close category-buttons
                }

                // Special layout for INTERIOR LIGHTS with sections
                if (category === 'INTERIOR LIGHTS') {
                    html += `<div class="interior-lights-container">`;
                    html += `<div class="interior-lights-section section-1">`;
                    html += `<div class="interior-lights-section-title">DIMMING</div>`;
                    html += `<div class="interior-lights-grid">`;
                    
                    // Rendre les 4 potentiomètres en 2x2
                    const potentiometers = commands.filter(c => c.controlType === 'potentiometer');
                    for (const cmd of potentiometers) {
                        html += renderPotentiometer(cmd);
                    }
                    
                    html += `</div>`; // close interior-lights-grid
                    html += `</div>`; // close section-1
                    html += `</div>`; // close interior-lights-container
                } else if (category === 'LUMIÈRES') {
                    // Layout spécial pour LUMIÈRES : switches cylindriques dans un cadre avec titre
                    html += `<div class="lights-wrapper">`;
                    html += `<div class="lights-container">`;
                    html += `<div class="lights-title">LIGHTS</div>`;
                    html += `<div class="lights-switches">`;
                    
                    // Ordre spécifique : BEACON, LAND, TAXI, NAV, STROBE
                    const lightsOrder = ['beacon', 'landing_light', 'taxi_light', 'nav_lights', 'strobe'];
                    const lightsCommands = lightsOrder.map(id => commands.find(c => c.id === id)).filter(c => c);
                    
                    for (const cmd of lightsCommands) {
                        if (cmd.controlType === 'toggle') {
                            html += renderCylindricalSwitch(cmd, true); // true = pour les lumières
                        }
                    }
                    
                    html += `</div>`; // close lights-switches
                    html += `</div>`; // close lights-container
                    html += `</div>`; // close lights-wrapper
                } else if (category === 'ÉLECTRIQUE') {
                    // Layout spécial pour ÉLECTRIQUE : switches double-toggle côte à côte
                    html += `<div class="electrical-container">`;
                    
                    // Switch MASTER (ALT + BAT)
                    const altCmd = commands.find(c => c.id === 'master_alternator');
                    const batCmd = commands.find(c => c.id === 'master_battery');
                    if (altCmd && batCmd) {
                        html += renderDoubleToggleSwitch('MASTER', ['ALT', 'BAT'], [altCmd, batCmd]);
                    }
                    
                    // Switch AVIONICS (BUS 1 + BUS 2)
                    const bus1Cmd = commands.find(c => c.id === 'avionics_bus_1');
                    const bus2Cmd = commands.find(c => c.id === 'avionics_bus_2');
                    if (bus1Cmd && bus2Cmd) {
                        html += renderDoubleToggleSwitch('AVIONICS', ['BUS 1', 'BUS 2'], [bus1Cmd, bus2Cmd]);
                    }
                    
                    // Autres boutons ÉLECTRIQUE (Fuel Pump, Pitot Heat, etc.)
                    const otherCommands = commands.filter(c => 
                        c.id !== 'master_alternator' && 
                        c.id !== 'master_battery' && 
                        c.id !== 'avionics_bus_1' && 
                        c.id !== 'avionics_bus_2'
                    ).sort((a, b) => {
                        // Trier pour mettre fuel_pump avant pitot_heat
                        if (a.id === 'fuel_pump' && b.id === 'pitot_heat') return -1;
                        if (a.id === 'pitot_heat' && b.id === 'fuel_pump') return 1;
                        return 0;
                    });
                    
                    if (otherCommands.length > 0) {
                        html += `<div class="electrical-other-buttons">`;
                        for (const cmd of otherCommands) {
                            if (cmd.controlType === 'toggle') {
                                html += renderCylindricalSwitch(cmd);
                            } else if (cmd.controlType === 'momentary') {
                                html += renderMomentary(cmd);
                            }
                        }
                        html += `</div>`; // close electrical-other-buttons
                    }
                    
                    html += `</div>`; // close electrical-container
                } else if (category !== 'AUTOPILOT') {
                    // Layout normal pour les autres catégories (sauf AUTOPILOT qui a son propre layout)
                    html += `<div class="category-buttons">`;

                    for (const cmd of commands) {
                        if (cmd.controlType === 'toggle') {
                            html += renderToggle(cmd);
                        } else if (cmd.controlType === 'selector') {
                            html += renderSelector(cmd);
                        } else if (cmd.controlType === 'momentary') {
                            html += renderMomentary(cmd);
                        } else if (cmd.controlType === 'potentiometer') {
                            console.log(`[DEBUG] Rendering potentiometer: ${cmd.id} (${cmd.name})`);
                            html += renderPotentiometer(cmd);
                        } else {
                            console.log(`[DEBUG] Unknown controlType: ${cmd.controlType} for ${cmd.id}`);
                        }
                    }

                    html += `</div>`; // close category-buttons
                }

                // Control buttons row - BELOW main buttons
                if (category === 'AUTOPILOT') {
                    html += `<div class="controls-row">`;
                    html += `<div class="control-spacer"></div>`; // AP
                    // Sélecteur d'incrément HDG sous FD
                    html += `<div class="control-group increment-selector-group">`;
                    html += `<button class="ctrl-btn increment-selector-btn" data-hdg-value="10" onclick="setHdgIncrement(10)">+10</button>`;
                    html += `<button class="ctrl-btn increment-selector-btn" data-hdg-value="100" onclick="setHdgIncrement(100)">+100</button>`;
                    html += `</div>`;
                    // HDG controls - + en haut, - en bas
                    html += `<div class="control-group vs-controls"><button class="ctrl-btn" onclick="sendHdgIncrement(true)">+</button><button class="ctrl-btn" onclick="sendHdgIncrement(false)">−</button></div>`;
                    // ALT controls - + en haut, - en bas
                    html += `<div class="control-group vs-controls"><button class="ctrl-btn" onclick="sendAltIncrement(true)">+</button><button class="ctrl-btn" onclick="sendAltIncrement(false)">−</button></div>`;
                    // Sélecteur d'incrément ALT sous NAV
                    html += `<div class="control-group increment-selector-group">`;
                    html += `<button class="ctrl-btn increment-selector-btn" data-alt-value="100" onclick="setAltIncrement(100)">+100</button>`;
                    html += `<button class="ctrl-btn increment-selector-btn" data-alt-value="1000" onclick="setAltIncrement(1000)">+1000</button>`;
                    html += `</div>`;
                    html += `<div class="control-spacer"></div>`; // VNAV
                    html += `<div class="control-spacer"></div>`; // APR
                    html += `<div class="control-spacer"></div>`; // BC
                    // VS controls - Nose UP/DN sur 2 lignes
                    html += `<div class="control-group vs-controls">`;
                    html += `<button class="ctrl-btn nose-btn" onclick="sendToggle('vs_inc')"><span class="nose-label">Nose</span><span class="nose-direction">UP</span></button>`;
                    html += `<button class="ctrl-btn nose-btn" onclick="sendToggle('vs_dec')"><span class="nose-label">Nose</span><span class="nose-direction">DN</span></button>`;
                    html += `</div>`;
                    // SPD controls (pour FLC) - + en haut, - en bas
                    html += `<div class="control-group vs-controls"><button class="ctrl-btn" onclick="sendToggle('spd_inc')">+</button><button class="ctrl-btn" onclick="sendToggle('spd_dec')">−</button></div>`;
                    html += `</div>`; // close controls-row
                    html += `</div>`; // close autopilot-panel
                }
                html += `</div>`; // close category
            }

            controlsEl.innerHTML = html;

            // Attacher les event listeners pour les potentiomètres
            document.querySelectorAll('.potentiometer-slider').forEach(slider => {
                const cmdId = slider.dataset.cmdId;
                let lastSentValue = -1; // Valeur initiale pour forcer l'envoi de la première valeur
                let isDragging = false;
                
                const updateAndSend = (value) => {
                    const potentiometer = slider.closest('.potentiometer-control');
                    const valueLabel = potentiometer.querySelector('.potentiometer-value');
                    const fillBar = potentiometer.querySelector('.potentiometer-fill');
                    
                    // Mise à jour visuelle immédiate
                    if (valueLabel) valueLabel.textContent = `${value}%`;
                    if (fillBar) fillBar.style.width = `${value}%`;
                    
                    // Envoi de commande seulement si la valeur a changé
                    if (lastSentValue !== value) {
                        console.log(`[DEBUG] Potentiometer ${cmdId}: sending value ${value} during drag`);
                        sendPotentiometer(cmdId, value);
                        lastSentValue = value;
                    }
                };
                
                // Event 'input': mise à jour visuelle + envoi de commande en temps réel
                slider.addEventListener('input', (e) => {
                    const value = parseInt(e.target.value);
                    updateAndSend(value);
                });
                
                // Event 'mousedown': marquer le début du drag
                slider.addEventListener('mousedown', () => {
                    isDragging = true;
                });
                
                // Event 'mousemove': capturer les changements pendant le drag
                slider.addEventListener('mousemove', (e) => {
                    if (isDragging && e.buttons === 1) {
                        const value = parseInt(slider.value);
                        updateAndSend(value);
                    }
                });
                
                // Event 'mouseup': fin du drag
                slider.addEventListener('mouseup', () => {
                    isDragging = false;
                });
                
                // Event 'touchstart': marquer le début du drag tactile
                slider.addEventListener('touchstart', () => {
                    isDragging = true;
                });
                
                // Event 'touchmove': capturer les changements pendant le drag tactile
                slider.addEventListener('touchmove', () => {
                    if (isDragging) {
                        const value = parseInt(slider.value);
                        updateAndSend(value);
                    }
                });
                
                // Event 'touchend': fin du drag tactile
                slider.addEventListener('touchend', () => {
                    isDragging = false;
                });
                
                // Event 'change': envoie la commande finale quand l'utilisateur relâche (sécurité)
                slider.addEventListener('change', (e) => {
                    const value = parseInt(e.target.value);
                    // Envoyer seulement si la valeur finale est différente de la dernière envoyée
                    if (lastSentValue !== value) {
                        console.log(`[DEBUG] Potentiometer ${cmdId}: sending final value ${value}`);
                        sendPotentiometer(cmdId, value);
                        lastSentValue = value;
                    }
                });
            });

            // Attacher les event listeners pour les switches cylindriques (zone de touch optimisée)
            document.querySelectorAll('.cylindrical-switch').forEach(switchEl => {
                const cmdId = switchEl.dataset.id;
                // Rendre toute la zone switch cliquable pour le tactile
                switchEl.style.cursor = 'pointer';
                switchEl.addEventListener('click', () => {
                    sendToggle(cmdId);
                });
            });

            // Initialiser les sélecteurs d'incrément
            setHdgIncrement(10); // Valeur par défaut : 10
            setAltIncrement(100); // Valeur par défaut : 100

            // Appliquer les états déjà connus aux nouveaux éléments
            for (const [id, value] of Object.entries(states)) {
                updateControlState(id, value);
            }
        }

        /**
         * Génère le HTML pour un bouton Toggle (ON/OFF avec LED)
         */
        function renderToggle(cmd) {
            const state = states[cmd.id] || 0;
            const stateClass = state > 0.5 ? 'on' : 'off';
            return `
                <button class="btn-toggle ${stateClass}" data-id="${cmd.id}" onclick="sendToggle('${cmd.id}')">
                    <div class="indicator"></div>
                    <span class="label">${cmd.name}</span>
                </button>
            `;
        }

        /**
         * Génère le HTML pour un Selector (multi-positions)
         * Cas spécial pour les volets (flaps) avec boutons +/-
         */
        function renderSelector(cmd) {
            if (!cmd.options) return '';

            const currentValue = states[cmd.id] || 0;

            let optionsHtml = '';
            for (const opt of cmd.options) {
                const active = Math.abs(currentValue - opt.value) < 0.5 ? 'active' : '';
                optionsHtml += `
                    <button class="selector-option ${active}"
                            data-id="${cmd.id}"
                            data-value="${opt.value}"
                            onclick="sendSelector('${cmd.id}', '${opt.simEvent}', ${opt.value})">
                        ${opt.label}
                    </button>
                `;
            }

            // Special layout for flaps: vertical selector with +/- buttons on right
            if (cmd.id === 'flaps') {
                return `
                    <div class="flaps-control" data-id="${cmd.id}">
                        <span class="selector-label">${cmd.name}</span>
                        <div class="flaps-content">
                            <div class="selector-options">
                                ${optionsHtml}
                            </div>
                            <div class="flaps-buttons">
                                <button class="flaps-btn" onclick="sendToggle('flaps_decr')">−</button>
                                <button class="flaps-btn" onclick="sendToggle('flaps_incr')">+</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="selector" data-id="${cmd.id}">
                    <span class="selector-label">${cmd.name}</span>
                    <div class="selector-options">
                        ${optionsHtml}
                    </div>
                </div>
            `;
        }

        /**
         * Génère le HTML pour un bouton Momentary (appui bref, pas de LED)
         */
        function renderMomentary(cmd) {
            return `
                <button class="btn-momentary" data-id="${cmd.id}" onclick="sendToggle('${cmd.id}')">
                    <span class="label">${cmd.name}</span>
                </button>
            `;
        }

        /**
         * Génère le HTML pour un switch double-toggle (deux boutons côte à côte)
         * @param {string} title - Titre principal (ex: "MASTER", "AVIONICS")
         * @param {string[]} labels - Labels pour chaque levier (ex: ["ALT", "BAT"])
         * @param {Array} commands - Tableau de 2 AircraftCommand
         */
        function renderDoubleToggleSwitch(title, labels, commands) {
            const state1 = states[commands[0].id] || 0;
            const state2 = states[commands[1].id] || 0;
            const stateClass1 = state1 > 0.5 ? 'on' : 'off';
            const stateClass2 = state2 > 0.5 ? 'on' : 'off';
            // Classe de couleur selon le type de switch
            const colorClass = title === 'MASTER' ? 'switch-red' : 'switch-grey';
            
            return `
                <div class="double-toggle-switch">
                    <div class="double-toggle-title">${title}</div>
                    <div class="double-toggle-labels">
                        <span class="double-toggle-label-left">${labels[0]}</span>
                        <span class="double-toggle-label-right">${labels[1]}</span>
                    </div>
                    <div class="double-toggle-buttons">
                        <button class="double-toggle-btn ${colorClass} ${stateClass1}" 
                                data-id="${commands[0].id}" 
                                onclick="sendToggle('${commands[0].id}')">
                            <div class="indicator"></div>
                        </button>
                        <button class="double-toggle-btn ${colorClass} ${stateClass2}" 
                                data-id="${commands[1].id}" 
                                onclick="sendToggle('${commands[1].id}')">
                            <div class="indicator"></div>
                        </button>
                    </div>
                </div>
            `;
        }

        /**
         * Génère le HTML pour un switch cylindrique (style cockpit)
         * @param {Object} cmd - AircraftCommand
         * @param {boolean} isLightSwitch - Si true, utilise un indicateur ambre au lieu de rouge
         */
        function renderCylindricalSwitch(cmd, isLightSwitch = false) {
            const state = states[cmd.id] || 0;
            const isOn = state > 0.5;
            // Couleur du levier : vert pour Pitot Heat, blanc/gris pour les autres
            const leverColor = cmd.id === 'pitot_heat' ? 'green' : 'white';
            const indicatorClass = isOn ? (isLightSwitch ? 'on-indicator-light' : 'on-indicator') : '';
            
            return `
                <div class="cylindrical-switch" data-id="${cmd.id}">
                    <div class="cylindrical-switch-label">${cmd.name}</div>
                    <div class="cylindrical-switch-lever-wrapper">
                        <div class="cylindrical-switch-bezel ${indicatorClass}">
                            <div class="cylindrical-switch-lever ${leverColor} ${isOn ? 'on' : 'off'}" 
                                 data-id="${cmd.id}">
                            </div>
                        </div>
                    </div>
                    <div class="cylindrical-switch-state">${isOn ? 'ON' : 'OFF'}</div>
                </div>
            `;
        }

        /**
         * Génère le HTML pour un Potentiometer (slider 0-100%)
         */
        function renderPotentiometer(cmd) {
            const currentValue = states[cmd.id] || 0;
            const percentValue = Math.round(currentValue);
            return `
                <div class="potentiometer-control" data-cmd-id="${cmd.id}">
                    <div class="potentiometer-label">${cmd.name}</div>
                    <div class="potentiometer-value" data-cmd-id="${cmd.id}">${percentValue}%</div>
                    <div class="potentiometer-track-wrapper">
                        <div class="potentiometer-track" data-cmd-id="${cmd.id}">
                            <div class="potentiometer-fill" data-cmd-id="${cmd.id}" style="width: ${percentValue}%"></div>
                        </div>
                        <input type="range" 
                               class="potentiometer-slider" 
                               data-cmd-id="${cmd.id}"
                               min="0" 
                               max="100" 
                               step="1" 
                               value="${percentValue}"
                               aria-label="${cmd.name}">
                    </div>
                </div>
            `;
        }

        // ================================================================
        // MISE À JOUR DE L'INTERFACE
        // ================================================================

        /**
         * Met à jour l'état visuel d'un contrôle
         * Appelé quand le serveur envoie un changement d'état
         *
         * @param {string} id - ID de la commande (ex: "nav_lights")
         * @param {number} value - Nouvelle valeur (0.0 ou 1.0 pour Bool, autres pour Number)
         */
        function updateControlState(id, value) {
            states[id] = value;

            // Toggle buttons
            const toggleBtn = document.querySelector(`.btn-toggle[data-id="${id}"]`);
            if (toggleBtn) {
                toggleBtn.classList.remove('on', 'off');
                toggleBtn.classList.add(value > 0.5 ? 'on' : 'off');
            }

            // Double-toggle switches
            const doubleToggleBtn = document.querySelector(`.double-toggle-btn[data-id="${id}"]`);
            if (doubleToggleBtn) {
                doubleToggleBtn.classList.remove('on', 'off');
                doubleToggleBtn.classList.add(value > 0.5 ? 'on' : 'off');
            }

            // Cylindrical switches
            const cylindricalSwitch = document.querySelector(`.cylindrical-switch[data-id="${id}"]`);
            if (cylindricalSwitch) {
                const lever = cylindricalSwitch.querySelector('.cylindrical-switch-lever');
                const bezel = cylindricalSwitch.querySelector('.cylindrical-switch-bezel');
                const stateLabel = cylindricalSwitch.querySelector('.cylindrical-switch-state');
                const isOn = value > 0.5;
                // Vérifier si c'est un switch de lumières (dans .lights-container)
                const isLightSwitch = cylindricalSwitch.closest('.lights-container') !== null;
                
                if (lever) {
                    lever.classList.remove('on', 'off');
                    lever.classList.add(isOn ? 'on' : 'off');
                }
                if (bezel) {
                    bezel.classList.remove('on-indicator', 'on-indicator-light');
                    if (isOn) {
                        bezel.classList.add(isLightSwitch ? 'on-indicator-light' : 'on-indicator');
                    }
                }
                if (stateLabel) {
                    stateLabel.textContent = isOn ? 'ON' : 'OFF';
                }
            }

            // Selector options (including flaps-control)
            const selector = document.querySelector(`.selector[data-id="${id}"], .flaps-control[data-id="${id}"]`);
            if (selector) {
                const options = selector.querySelectorAll('.selector-option');
                options.forEach(opt => {
                    const optValue = parseFloat(opt.dataset.value);
                    opt.classList.toggle('active', Math.abs(value - optValue) < 0.5);
                });
            }

            // === AFFICHEURS AUTOPILOT ===
            // Ces IDs correspondent aux commandes "hidden" du profil
            // Logique spéciale: SPD et VS ne s'affichent que si le mode correspondant est actif
            if (id === 'display_spd') {
                const el = document.getElementById('display-spd');
                const flcActive = states['ap_flc'] > 0.5;
                if (el) el.textContent = flcActive ? Math.round(value) : '---';
            }
            if (id === 'display_hdg') {
                const el = document.getElementById('display-hdg');
                if (el) el.textContent = Math.round(value).toString().padStart(3, '0');
            }
            if (id === 'display_alt') {
                const el = document.getElementById('display-alt');
                if (el) el.textContent = Math.round(value).toString().padStart(5, '0');
            }
            if (id === 'display_vs') {
                const el = document.getElementById('display-vs');
                const vsActive = states['ap_vs'] > 0.5;
                if (el) el.textContent = vsActive ? ((value >= 0 ? '+' : '') + Math.round(value)) : '----';
            }
            // Update displays when button state changes
            if (id === 'ap_flc') {
                const el = document.getElementById('display-spd');
                const spdValue = states['display_spd'] || 0;
                if (el) el.textContent = value > 0.5 ? Math.round(spdValue) : '---';
            }
            if (id === 'ap_vs') {
                const el = document.getElementById('display-vs');
                const vsValue = states['display_vs'] || 0;
                if (el) el.textContent = value > 0.5 ? ((vsValue >= 0 ? '+' : '') + Math.round(vsValue)) : '----';
            }

            // Potentiometer controls
            const potentiometer = document.querySelector(`.potentiometer-control[data-cmd-id="${id}"]`);
            if (potentiometer) {
                const percentValue = Math.round(value);
                const valueLabel = potentiometer.querySelector('.potentiometer-value');
                const fillBar = potentiometer.querySelector('.potentiometer-fill');
                const slider = potentiometer.querySelector('.potentiometer-slider');
                
                console.log(`[DEBUG] Potentiometer ${id}: updating to ${percentValue}%`);
                
                if (valueLabel) valueLabel.textContent = `${percentValue}%`;
                if (fillBar) fillBar.style.width = `${percentValue}%`;
                if (slider) slider.value = percentValue;
            } else {
                // Debug: vérifier si l'élément existe avec un autre sélecteur
                const altSelector = document.querySelector(`[data-cmd-id="${id}"]`);
                if (altSelector) {
                    console.log(`[DEBUG] Potentiometer ${id}: found element but not .potentiometer-control`, altSelector);
                } else {
                    console.log(`[DEBUG] Potentiometer ${id}: element not found`);
                }
            }
        }

        // ================================================================
        // ENVOI DE COMMANDES
        // ================================================================

        /**
         * Envoie une commande Toggle/Momentary au serveur
         * @param {string} id - ID de la commande (ex: "nav_lights", "hdg_inc_10")
         */
        function sendToggle(id) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({
                type: 'command',
                data: { id: id }
            }));
        }

        /**
         * Envoie une commande Selector au serveur avec l'event spécifique
         * @param {string} id - ID de la commande (ex: "flaps")
         * @param {string} simEvent - Event SimConnect à exécuter (ex: "FLAPS_2")
         * @param {number} value - Valeur de la position (ex: 2)
         */
        function sendSelector(id, simEvent, value) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({
                type: 'command',
                data: { id: id, simEvent: simEvent, value: value }
            }));

            // Mise à jour optimiste de l'UI (n'attend pas la confirmation serveur)
            updateControlState(id, value);
        }

        /**
         * Envoie une commande Potentiometer au serveur avec la valeur (0-100)
         * @param {string} id - ID de la commande (ex: "interior_panels")
         * @param {number} value - Valeur du potentiomètre (0-100)
         */
        function sendPotentiometer(id, value) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                console.log(`[DEBUG] Potentiometer ${id}: WebSocket not ready, state=${ws?.readyState}`);
                return;
            }

            const message = {
                type: 'command',
                data: { id: id, value: value }
            };
            console.log(`[DEBUG] Potentiometer ${id}: sending command`, message);
            ws.send(JSON.stringify(message));
        }

        // ================================================================
        // HDG & ALT INCREMENT SELECTORS
        // ================================================================
        let hdgIncrement = 10; // Valeur par défaut : 10
        let altIncrement = 100; // Valeur par défaut : 100

        /**
         * Définit l'incrément pour les boutons HDG (+/-)
         * @param {number} value - Valeur de l'incrément (10 ou 100)
         */
        function setHdgIncrement(value) {
            hdgIncrement = value;
            // Mettre à jour l'apparence des boutons sélecteurs HDG uniquement
            document.querySelectorAll('[data-hdg-value]').forEach(btn => {
                const btnValue = parseInt(btn.dataset.hdgValue);
                if (btnValue === value) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        /**
         * Envoie une commande d'incrément/décrément HDG avec l'incrément sélectionné
         * @param {boolean} increment - true pour incrémenter, false pour décrémenter
         */
        function sendHdgIncrement(increment) {
            if (hdgIncrement === 10) {
                const commandId = increment ? 'hdg_inc_10' : 'hdg_dec_10';
                sendToggle(commandId);
            } else if (hdgIncrement === 100) {
                // Pour +100, répéter hdg_inc_10 dix fois
                const baseCmd = increment ? 'hdg_inc_10' : 'hdg_dec_10';
                for (let i = 0; i < 10; i++) {
                    setTimeout(() => sendToggle(baseCmd), i * 10); // Espacer de 10ms
                }
            }
        }

        /**
         * Définit l'incrément pour les boutons ALT (+/-)
         * @param {number} value - Valeur de l'incrément (100 ou 1000)
         */
        function setAltIncrement(value) {
            altIncrement = value;
            // Mettre à jour l'apparence des boutons sélecteurs ALT uniquement
            document.querySelectorAll('[data-alt-value]').forEach(btn => {
                const btnValue = parseInt(btn.dataset.altValue);
                if (btnValue === value) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        /**
         * Envoie une commande d'incrément/décrément ALT avec l'incrément sélectionné
         * @param {boolean} increment - true pour incrémenter, false pour décrémenter
         */
        function sendAltIncrement(increment) {
            const commandId = increment 
                ? (altIncrement === 100 ? 'alt_inc_100' : 'alt_inc_1000')
                : (altIncrement === 100 ? 'alt_dec_100' : 'alt_dec_1000');
            sendToggle(commandId);
        }

        // ================================================================
        // HEARTBEAT & DÉMARRAGE
        // ================================================================

        // Ping toutes les 30 secondes pour garder la connexion active
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);

        // Démarrage de l'application
        connect();
    </script>
</body>
</html>
